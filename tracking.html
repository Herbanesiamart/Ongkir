<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cek Resi Massal — Ongkir Compare</title>
<style>
  :root {
    --bg:     #f4f6fa;
    --card:   #ffffff;
    --border: #e2e8f0;
    --text:   #1e293b;
    --sub:    #64748b;
    --blue:   #3b82f6;
    --green:  #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #86efac;
    --red:    #dc2626;
    --red-bg: #fef2f2;
    --yellow: #d97706;
    --yellow-bg: #fffbeb;
    --radius: 12px;
    --shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--blue); color: #fff;
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header a  { color: #bfdbfe; font-size: 13px; text-decoration: none; }

  /* LAYOUT */
  .wrap { max-width: 680px; margin: 24px auto 48px; padding: 0 16px; }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .f-label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  textarea.f-input {
    width: 100%; min-height: 130px; padding: 10px 13px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--text); background: #fff;
    outline: none; resize: vertical; transition: border-color .15s;
    font-family: 'SF Mono', 'Fira Code', monospace;
    line-height: 1.6;
  }
  textarea.f-input:focus { border-color: var(--blue); }
  .hint { font-size: 11px; color: var(--sub); margin-top: 6px; }

  .btn {
    width: 100%; margin-top: 14px; padding: 12px;
    background: var(--blue); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .btn:hover  { background: #2563eb; }
  .btn:disabled { background: #93c5fd; cursor: default; }

  /* STATS BAR */
  .stats-bar {
    display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .stat-pill {
    display: flex; align-items: center; gap: 5px;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 5px 12px;
    font-size: 12px; font-weight: 600; color: var(--sub);
  }
  .stat-pill.green  { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
  .stat-pill.red    { border-color: #fca5a5; color: var(--red); background: var(--red-bg); }
  .stat-pill.yellow { border-color: #fcd34d; color: var(--yellow); background: var(--yellow-bg); }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* RESI CARD */
  .resi-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden;
  }
  .resi-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent; transition: background .1s;
  }
  .resi-head:hover { background: #f8fafc; }
  .resi-head.open  { border-bottom-color: var(--border); }

  .resi-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .s-delivered    { background: var(--green); }
  .s-transit      { background: var(--blue); }
  .s-out_delivery { background: #8b5cf6; }
  .s-pickup       { background: #0ea5e9; }
  .s-problem      { background: var(--red); }
  .s-retur        { background: var(--yellow); }
  .s-unknown      { background: #94a3b8; }
  .s-error        { background: #94a3b8; }

  .resi-num  { font-size: 13px; font-weight: 700; font-family: 'SF Mono', monospace; }
  .resi-sub  { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .resi-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .status-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  }
  .badge-delivered    { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge-transit      { background: #eff6ff; color: var(--blue); border: 1px solid #bfdbfe; }
  .badge-out_delivery { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }
  .badge-pickup       { background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
  .badge-problem      { background: var(--red-bg); color: var(--red); border: 1px solid #fca5a5; }
  .badge-retur        { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #fcd34d; }
  .badge-unknown, .badge-error { background: #f8fafc; color: var(--sub); border: 1px solid var(--border); }

  .chevron { font-size: 12px; color: var(--sub); transition: transform .2s; }
  .chevron.open { transform: rotate(90deg); }

  /* DETAIL */
  .resi-detail { display: none; padding: 14px 16px; }
  .resi-detail.open { display: block; }

  .meta-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .meta-item { font-size: 12px; color: var(--sub); }
  .meta-item strong { color: var(--text); font-size: 13px; display: block; margin-top: 2px; }

  .timeline-title { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl-item { display: flex; gap: 12px; }
  .tl-line-wrap { display: flex; flex-direction: column; align-items: center; }
  .tl-dot-outer { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--blue); background: #fff; flex-shrink: 0; margin-top: 2px; }
  .tl-item:first-child .tl-dot-outer { background: var(--blue); }
  .tl-line { width: 2px; flex: 1; background: var(--border); margin: 2px 0; min-height: 12px; }
  .tl-item:last-child .tl-line { display: none; }
  .tl-body { padding-bottom: 14px; }
  .tl-desc { font-size: 13px; color: var(--text); }
  .tl-meta { font-size: 11px; color: var(--sub); margin-top: 2px; }

  .err-box { font-size: 13px; color: var(--red); background: var(--red-bg); border-radius: 8px; padding: 10px 12px; }

  /* LOADING */
  .loading { text-align: center; padding: 36px 20px; color: var(--sub); font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* COPY RESI */
  .copy-btn { font-size: 10px; background: #f1f5f9; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; color: var(--sub); margin-left: 6px; }
  .copy-btn:hover { background: var(--border); }
</style>
</head>
<body>

<div class="header">
  <h1>📦 Cek Resi Massal</h1>
  <a href="/">← Bandingkan Ongkir</a>
</div>

<div class="wrap">

  <div class="card">
    <label class="f-label">Nomor Resi (1 per baris, maks. 30)</label>
    <textarea class="f-input" id="resi-input"
      placeholder="JNE1234567890&#10;SICEPAT9876543210&#10;JT1234567890&#10;..."></textarea>
    <div class="hint" id="resi-count-hint">Paste nomor resi, 1 per baris. Ganda otomatis dibuang.</div>
    <button class="btn" id="btn-cek" onclick="doCek()">🔍 Cek Semua Resi</button>
  </div>

  <div id="results-area" style="display:none"></div>

</div>

<script>
// ── Input counter ─────────────────────────────────────────────────────────────
const resiInput = document.getElementById('resi-input');
const hint      = document.getElementById('resi-count-hint');

resiInput.addEventListener('input', updateCount);

function parseResi() {
  return [...new Set(
    resiInput.value.split('\n')
      .map(r => r.trim().toUpperCase())
      .filter(r => r.length >= 5)
  )];
}

function updateCount() {
  const list = parseResi();
  if (!list.length) {
    hint.textContent = 'Paste nomor resi, 1 per baris. Ganda otomatis dibuang.';
  } else {
    hint.textContent = `${list.length} resi terdeteksi${list.length > 30 ? ' — maks. 30, sisanya diabaikan' : ''}`;
  }
}

// ── Cek ──────────────────────────────────────────────────────────────────────
const resultsArea = document.getElementById('results-area');
const btnCek      = document.getElementById('btn-cek');

async function doCek() {
  const resiList = parseResi().slice(0, 30);
  if (!resiList.length) { alert('Masukkan minimal 1 nomor resi.'); return; }

  btnCek.disabled = true;
  btnCek.textContent = 'Mengecek…';
  resultsArea.style.display = 'block';
  resultsArea.innerHTML = `<div class="loading"><div class="spinner"></div>Mengecek ${resiList.length} resi secara paralel…</div>`;

  try {
    const r = await fetch('/api/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resi: resiList }),
    });
    const json = await r.json();
    if (!json.ok) throw new Error(json.error || 'Gagal');
    renderResults(json.results);
  } catch (e) {
    resultsArea.innerHTML = `<div class="err-box">⚠ Gagal terhubung ke server: ${e.message}</div>`;
  } finally {
    btnCek.disabled = false;
    btnCek.textContent = '🔍 Cek Semua Resi';
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderResults(results) {
  const delivered = results.filter(r => r.ok && r.statusType === 'delivered').length;
  const problem   = results.filter(r => r.ok && (r.statusType === 'problem' || r.statusType === 'retur')).length;
  const notFound  = results.filter(r => !r.ok).length;
  const transit   = results.length - delivered - problem - notFound;

  let html = `<div class="stats-bar">
    <div class="stat-pill">${results.length} total</div>
    ${delivered ? `<div class="stat-pill green"><div class="stat-dot"></div>${delivered} terkirim</div>` : ''}
    ${transit   ? `<div class="stat-pill"><div class="stat-dot" style="background:var(--blue)"></div>${transit} proses</div>` : ''}
    ${problem   ? `<div class="stat-pill red"><div class="stat-dot"></div>${problem} bermasalah</div>` : ''}
    ${notFound  ? `<div class="stat-pill yellow"><div class="stat-dot"></div>${notFound} tidak ditemukan</div>` : ''}
  </div>`;

  results.forEach((r, idx) => {
    const type = r.ok ? r.statusType : 'error';
    const label = r.ok ? r.statusLabel : 'Tidak Ditemukan';
    const courier = r.courier ? ` · ${r.courier}` : '';
    const lastDesc = r.ok && r.history?.length ? r.history[0].desc : (r.error || '');

    html += `
    <div class="resi-card" id="card-${idx}">
      <div class="resi-head" onclick="toggleDetail(${idx})">
        <div class="resi-left">
          <div class="status-dot s-${type}"></div>
          <div>
            <div class="resi-num">${r.resi}<button class="copy-btn" onclick="copyResi(event,'${r.resi}')">copy</button></div>
            <div class="resi-sub">${courier ? courier.replace(' · ', '') : ''}${lastDesc ? ` · ${lastDesc.slice(0, 60)}${lastDesc.length > 60 ? '…' : ''}` : ''}</div>
          </div>
        </div>
        <div class="resi-right">
          <span class="status-badge badge-${type}">${label}</span>
          <span class="chevron" id="chev-${idx}">▶</span>
        </div>
      </div>
      <div class="resi-detail" id="detail-${idx}">
        ${renderDetail(r)}
      </div>
    </div>`;
  });

  resultsArea.innerHTML = html;
}

function renderDetail(r) {
  if (!r.ok) {
    return `<div class="err-box">⚠ ${r.error}</div>`;
  }

  let html = '';

  // Meta info
  const metas = [];
  if (r.courier)     metas.push({ label: 'Kurir',  val: r.courier });
  if (r.origin)      metas.push({ label: 'Pengirim', val: r.origin });
  if (r.destination) metas.push({ label: 'Tujuan',  val: r.destination });
  if (r.lastTime)    metas.push({ label: 'Update Terakhir', val: r.lastTime });

  if (metas.length) {
    html += `<div class="meta-row">${metas.map(m =>
      `<div class="meta-item">${m.label}<strong>${m.val}</strong></div>`
    ).join('')}</div>`;
  }

  if (!r.history?.length) {
    html += `<div style="font-size:13px;color:var(--sub)">Tidak ada riwayat tersedia.</div>`;
    return html;
  }

  html += `<div class="timeline-title">Riwayat Pengiriman</div>
  <div class="timeline">`;

  r.history.forEach(h => {
    const loc = h.loc ? ` · ${h.loc}` : '';
    html += `
    <div class="tl-item">
      <div class="tl-line-wrap">
        <div class="tl-dot-outer"></div>
        <div class="tl-line"></div>
      </div>
      <div class="tl-body">
        <div class="tl-desc">${h.desc || '—'}</div>
        <div class="tl-meta">${h.time}${loc}</div>
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function toggleDetail(idx) {
  const detail = document.getElementById(`detail-${idx}`);
  const chev   = document.getElementById(`chev-${idx}`);
  const head   = detail.previousElementSibling;
  const open   = detail.classList.toggle('open');
  chev.classList.toggle('open', open);
  head.classList.toggle('open', open);
}

function copyResi(e, resi) {
  e.stopPropagation();
  navigator.clipboard.writeText(resi).then(() => {
    const btn = e.target;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = 'copy', 1200);
  });
}
</script>
</body>
</html>
