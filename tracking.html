<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cek Resi Massal — Ongkir Compare</title>
<style>
  :root {
    --bg:     #f4f6fa;
    --card:   #ffffff;
    --border: #e2e8f0;
    --text:   #1e293b;
    --sub:    #64748b;
    --blue:   #3b82f6;
    --green:  #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #86efac;
    --red:    #dc2626;
    --red-bg: #fef2f2;
    --yellow: #d97706;
    --yellow-bg: #fffbeb;
    --purple: #7c3aed;
    --radius: 12px;
    --shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header { background: var(--blue); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header a  { color: #bfdbfe; font-size: 13px; text-decoration: none; }

  .wrap { max-width: 680px; margin: 24px auto 48px; padding: 0 16px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .f-label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }

  textarea.f-input {
    width: 100%; min-height: 140px; padding: 10px 13px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--text); background: #fff;
    outline: none; resize: vertical; transition: border-color .15s;
    font-family: 'SF Mono', 'Fira Code', monospace; line-height: 1.7;
  }
  textarea.f-input:focus { border-color: var(--blue); }

  .f-row { display: flex; gap: 10px; margin-top: 12px; align-items: flex-end; }
  select.f-select {
    flex: 1; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--text); background: #fff; outline: none;
    transition: border-color .15s; cursor: pointer;
  }
  select.f-select:focus { border-color: var(--blue); }

  .hint      { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .hint-info { font-size: 11px; color: var(--blue); margin-top: 4px; }

  .btn { flex: 0 0 auto; padding: 11px 22px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .btn:hover    { background: #2563eb; }
  .btn:disabled { background: #93c5fd; cursor: default; }

  /* STATS */
  .stats-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .stats-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .stats-bar { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .stat-pill { display: flex; align-items: center; gap: 5px; background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--sub); cursor: pointer; transition: all .15s; user-select: none; }
  .stat-pill:hover  { border-color: #94a3b8; }
  .stat-pill.active { background: #1e293b; color: #fff; border-color: #1e293b; }
  .stat-pill.green  { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
  .stat-pill.green:hover  { background: #dcfce7; }
  .stat-pill.green.active { background: var(--green); color: #fff; border-color: var(--green); }
  .stat-pill.red    { border-color: #fca5a5; color: var(--red); background: var(--red-bg); }
  .stat-pill.red:hover    { background: #fee2e2; }
  .stat-pill.red.active   { background: var(--red); color: #fff; border-color: var(--red); }
  .stat-pill.blue   { border-color: #bfdbfe; color: var(--blue); background: #eff6ff; }
  .stat-pill.blue:hover   { background: #dbeafe; }
  .stat-pill.blue.active  { background: var(--blue); color: #fff; border-color: var(--blue); }
  .stat-pill.yellow { border-color: #fcd34d; color: var(--yellow); background: var(--yellow-bg); }
  .stat-pill.yellow.active { background: var(--yellow); color: #fff; border-color: var(--yellow); }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .dl-btn { flex-shrink: 0; padding: 6px 14px; background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--sub); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .dl-btn:hover { border-color: var(--blue); color: var(--blue); }

  /* RESI CARD */
  .resi-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
  .resi-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; transition: background .1s; }
  .resi-head:hover { background: #f8fafc; }
  .resi-head.open  { border-bottom-color: var(--border); }

  .resi-left { display: flex; align-items: center; gap: 12px; min-width: 0; overflow: hidden; }
  .stage-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .resi-num { font-size: 13px; font-weight: 700; font-family: 'SF Mono', monospace; }
  .resi-sub { font-size: 11px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .resi-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .stage-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }

  .chevron { font-size: 11px; color: var(--sub); transition: transform .2s; }
  .chevron.open { transform: rotate(90deg); }

  .resi-detail { display: none; padding: 16px; }
  .resi-detail.open { display: block; }

  /* STEPPER — sama dengan CS Input */
  .tr-stepper { display: flex; align-items: flex-start; gap: 0; margin: 0 0 18px; }
  .tr-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .tr-step-line {
    position: absolute; top: 11px; left: 50%; right: -50%;
    height: 2px; background: var(--border); z-index: 0;
  }
  .tr-step:last-child .tr-step-line { display: none; }
  .tr-step-circle {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    background: var(--card); color: var(--sub); font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1; transition: all .2s;
  }
  .tr-step-label { font-size: 9px; color: var(--sub); margin-top: 5px; text-align: center; line-height: 1.3; }
  /* Done */
  .tr-step-done .tr-step-circle  { background: var(--green); border-color: var(--green); color: #fff; }
  .tr-step-done .tr-step-line    { background: var(--green); }
  .tr-step-done .tr-step-label   { color: var(--green); }
  /* Active */
  .tr-step-active .tr-step-circle { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tr-step-active .tr-step-label  { color: var(--blue); font-weight: 700; }
  /* Problem */
  .tr-step-problem .tr-step-circle { background: var(--red); border-color: var(--red); color: #fff; }
  .tr-step-problem .tr-step-label  { color: var(--red); font-weight: 700; }
  /* Retur */
  .tr-step-retur .tr-step-circle { background: var(--yellow); border-color: var(--yellow); color: #fff; }
  .tr-step-retur .tr-step-label  { color: var(--yellow); font-weight: 700; }

  /* META ROW */
  .meta-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .meta-item { font-size: 12px; color: var(--sub); }
  .meta-item strong { color: var(--text); font-size: 13px; display: block; margin-top: 2px; }

  /* HISTORY — gaya CS Input */
  .history-title { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .history-list  { display: flex; flex-direction: column; gap: 0; }
  .history-item  { display: flex; gap: 12px; }
  .history-dot-wrap { display: flex; flex-direction: column; align-items: center; }
  .history-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .history-line { width: 2px; flex: 1; background: var(--border); margin: 3px 0; min-height: 10px; }
  .history-item:last-child .history-line { display: none; }
  .history-body { padding-bottom: 14px; }
  .history-desc { font-size: 12.5px; color: var(--text); }
  .history-desc.latest { font-weight: 700; }
  .history-meta { font-size: 11px; color: var(--sub); margin-top: 2px; }

  /* Need courier */
  .need-courier-box {
    background: var(--yellow-bg); border: 1px solid #fcd34d;
    border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--yellow);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .need-courier-box select { flex: 1; min-width: 140px; padding: 6px 10px; border: 1px solid #fcd34d; border-radius: 6px; font-size: 12px; background: #fff; }
  .need-courier-box button { padding: 6px 14px; border: none; border-radius: 6px; background: var(--yellow); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .err-box { font-size: 13px; color: var(--red); background: var(--red-bg); border-radius: 8px; padding: 10px 12px; }

  .loading { text-align: center; padding: 36px 20px; color: var(--sub); font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* PROGRESS */
  .progress-wrap { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 14px; }
  .progress-label { font-size: 13px; color: var(--sub); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .progress-label strong { color: var(--text); }
  .progress-bar-bg { background: var(--border); border-radius: 99px; height: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--blue); border-radius: 99px; transition: width .3s; }

  .copy-btn { font-size: 10px; background: #f1f5f9; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; color: var(--sub); margin-left: 6px; }
  .copy-btn:hover { background: var(--border); }
</style>
</head>
<body>

<div class="header">
  <h1>📦 Cek Resi Massal</h1>
  <a href="/">← Bandingkan Ongkir</a>
</div>

<div class="wrap">
  <div class="card">
    <label class="f-label">Nomor Resi (1 per baris)</label>
    <textarea class="f-input" id="resi-input"
      placeholder="JNE1234567890&#10;SICEPAT9876543210&#10;LP1234567890&#10;..."></textarea>
    <div class="f-row">
      <div style="flex:1">
        <div class="hint" id="resi-count-hint">Paste nomor resi, 1 per baris. Tidak ada batas jumlah.</div>
        <div class="hint-info">Kurir terdeteksi otomatis dari prefix. Kalau tidak terdeteksi, pilih default di bawah.</div>
      </div>
    </div>
    <div class="f-row">
      <select class="f-select" id="default-courier">
        <option value="">Kurir default (kalau tidak terdeteksi)</option>
        <option value="JNE">JNE</option>
        <option value="JT">J&amp;T Express</option>
        <option value="SiCepat">SiCepat</option>
        <option value="lion">Lion Parcel</option>
        <option value="SAP">SAP Express</option>
        <option value="anteraja">Anteraja</option>
        <option value="Ninja">Ninja Xpress</option>
        <option value="iDexpress">iDexpress</option>
        <option value="POS">POS Indonesia</option>
      </select>
      <button class="btn" onclick="doCek()">🔍 Cek Semua</button>
    </div>
  </div>

  <div id="results-area" style="display:none"></div>
</div>

<script>
// ── Stage config (sama dengan CS Input) ──────────────────────────────────────
const STAGE_META = {
  DIKIRIM:     { label:'🚚 Dikirim',      color:'#3b82f6', bg:'#eff6ff',   dot:'#3b82f6', step:2 },
  KOTA_TUJUAN: { label:'🏙️ Kota Tujuan', color:'#3b82f6', bg:'#eff6ff',   dot:'#3b82f6', step:3 },
  OTW:         { label:'🛵 OTW',          color:'#7c3aed', bg:'#f5f3ff',   dot:'#7c3aed', step:4 },
  SAMPAI:      { label:'✅ Sampai',       color:'#16a34a', bg:'#f0fdf4',   dot:'#16a34a', step:5 },
  BERMASALAH:  { label:'⚠️ Bermasalah',   color:'#dc2626', bg:'#fef2f2',   dot:'#dc2626', step:2, problem:true },
  RETUR:       { label:'↩️ Retur',        color:'#d97706', bg:'#fffbeb',   dot:'#d97706', step:2, retur:true },
};
const STEP_LABELS = ['Konfirmasi','Dikirim','Kota Tujuan','OTW','Sampai'];

const COURIER_LABEL = {
  JNE:'JNE', JT:'J&T Express', SiCepat:'SiCepat', lion:'Lion Parcel',
  SAP:'SAP Express', anteraja:'Anteraja', Ninja:'Ninja Xpress',
  iDexpress:'iDexpress', POS:'POS Indonesia',
};
const COURIER_OPTIONS = Object.entries(COURIER_LABEL).map(([v,l]) =>
  `<option value="${v}">${l}</option>`
).join('');

// ── Input counter ─────────────────────────────────────────────────────────────
document.getElementById('resi-input').addEventListener('input', () => {
  const list = parseResi();
  const hint = document.getElementById('resi-count-hint');
  if (!list.length) hint.textContent = 'Paste nomor resi, 1 per baris. Tidak ada batas jumlah.';
  else hint.textContent = `${list.length} resi terdeteksi`;
});

function parseResi() {
  return [...new Set(
    document.getElementById('resi-input').value
      .split('\n').map(r => r.trim().toUpperCase()).filter(r => r.length >= 5)
  )];
}

// ── Cek ──────────────────────────────────────────────────────────────────────
const BATCH_SIZE = 30;
let lastResults  = [];
let isCeking     = false;

async function doCek(retryItems = null) {
  if (isCeking) return;
  const resiList = retryItems || parseResi().map(r => ({ resi: r, courier: null }));
  if (!resiList.length) { alert('Masukkan minimal 1 nomor resi.'); return; }

  const defaultCourier = document.getElementById('default-courier').value || null;
  const items = resiList.map(r => ({ resi: r.resi, courier: r.courier || defaultCourier }));
  const total = items.length;

  isCeking     = true;
  lastResults  = [];
  activeFilter = 'semua';

  const ra = document.getElementById('results-area');
  ra.style.display = 'block';

  // Render progress bar awal
  const renderProgress = (done) => {
    const pct = Math.round((done / total) * 100);
    ra.querySelector('#prog-fill').style.width = pct + '%';
    ra.querySelector('#prog-label-done').textContent = done;
    // Update stats bar
    renderStats(lastResults, total);
  };

  ra.innerHTML = `
    <div class="progress-wrap" id="progress-box">
      <div class="progress-label">
        <span>Mengecek resi… <strong><span id="prog-label-done">0</span> / ${total}</strong></span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div id="stats-bar-wrap"></div>
    <div id="cards-wrap"></div>`;

  // Proses per batch
  for (let i = 0; i < items.length; i += BATCH_SIZE) {
    const batch = items.slice(i, i + BATCH_SIZE);
    try {
      const r    = await fetch('/api/track', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ resi: batch }) });
      const json = await r.json();
      if (json.ok) lastResults.push(...json.results);
    } catch { /* batch gagal, lanjut */ }

    const done = Math.min(i + BATCH_SIZE, total);
    ra.querySelector('#prog-label-done').textContent = done;
    ra.querySelector('#prog-fill').style.width = Math.round((done / total) * 100) + '%';
    renderStats(lastResults, total);
    renderCards(lastResults);
  }

  // Selesai — hapus progress bar
  const progBox = ra.querySelector('#progress-box');
  if (progBox) progBox.remove();
  isCeking = false;
}

async function retryWithCourier(resi, selectEl) {
  const courier = selectEl.value;
  if (!courier) return;
  selectEl.disabled = true; selectEl.nextElementSibling.disabled = true;
  try {
    const r    = await fetch('/api/track', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ resi: [{ resi, courier }] }) });
    const json = await r.json();
    if (!json.ok || !json.results?.[0]) throw new Error('Gagal');
    const idx = lastResults.findIndex(x => x.resi === resi);
    if (idx !== -1) lastResults[idx] = json.results[0];
    renderCards(lastResults);
    renderStats(lastResults, lastResults.length);
    setTimeout(() => {
      const newIdx = lastResults.findIndex(x => x.resi === resi);
      if (newIdx !== -1) toggleDetail(newIdx, true);
    }, 50);
  } catch {
    selectEl.disabled = false; selectEl.nextElementSibling.disabled = false;
  }
}

// ── Filter state ─────────────────────────────────────────────────────────────
let activeFilter = 'semua';

function filterGroup(r) {
  if (r.stage === 'SAMPAI')                         return 'terkirim';
  if (r.stage === 'BERMASALAH' || r.stage==='RETUR') return 'bermasalah';
  if (!r.ok && !r.needCourier)                       return 'tidak_ditemukan';
  if (r.needCourier)                                 return 'pilih_kurir';
  return 'proses';
}

function setFilter(f) {
  activeFilter = f;
  renderStats(lastResults, lastResults.length);
  renderCards(lastResults);
}

// ── Render results ────────────────────────────────────────────────────────────
function renderStats(results, total) {
  const wrap = document.getElementById('stats-bar-wrap');
  if (!wrap) return;
  const delivered   = results.filter(r => filterGroup(r) === 'terkirim').length;
  const transit     = results.filter(r => filterGroup(r) === 'proses').length;
  const problem     = results.filter(r => filterGroup(r) === 'bermasalah').length;
  const needCourier = results.filter(r => filterGroup(r) === 'pilih_kurir').length;
  const notFound    = results.filter(r => filterGroup(r) === 'tidak_ditemukan').length;

  const pill = (key, cls, dot, dotColor, count, label) => count === 0 ? '' :
    `<div class="stat-pill ${cls}${activeFilter===key?' active':''}" onclick="setFilter('${key}')">
      <div class="stat-dot" style="${dot?'':'background:'+dotColor}"></div>${count} ${label}
    </div>`;

  wrap.innerHTML = `<div class="stats-row">
    <div class="stats-bar">
      <div class="stat-pill${activeFilter==='semua'?' active':''}" onclick="setFilter('semua')">${results.length}${results.length < total ? ' / ' + total : ''} semua</div>
      ${pill('terkirim',  'green',  true, '',        delivered,   'terkirim')}
      ${pill('proses',    'blue',   false,'#3b82f6',  transit,     'proses')}
      ${pill('bermasalah','red',    true, '',         problem,     'bermasalah')}
      ${pill('pilih_kurir','yellow',true, '',         needCourier, 'pilih kurir')}
      ${pill('tidak_ditemukan','red',true,'',         notFound,    'tidak ditemukan')}
    </div>
    <button class="dl-btn" onclick="downloadResi()">⬇ Download</button>
  </div>`;
}

function getFilteredResults() {
  if (activeFilter === 'semua') return lastResults;
  return lastResults.filter(r => filterGroup(r) === activeFilter);
}

function downloadResi() {
  const filtered = getFilteredResults();
  if (!filtered.length) return;

  // CSV: Resi, Kurir, Status, Update Terakhir
  const STAGE_LABEL = {
    SAMPAI:'Terkirim', DIKIRIM:'Dikirim', KOTA_TUJUAN:'Kota Tujuan',
    OTW:'OTW', BERMASALAH:'Bermasalah', RETUR:'Retur',
  };
  const headers = ['Resi', 'Kurir', 'Status', 'Update Terakhir'];
  const rows = filtered.map(r => {
    const latest = r.history?.length ? r.history[r.history.length - 1] : null;
    return [
      r.resi,
      r.courierLabel || '',
      r.stage ? (STAGE_LABEL[r.stage] || r.stage) : (r.needCourier ? 'Pilih Kurir' : 'Tidak Ditemukan'),
      latest?.date || '',
    ];
  });
  const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = [headers, ...rows].map(row => row.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const label = activeFilter === 'semua' ? 'semua' : activeFilter;
  a.href     = url;
  a.download = `resi-${label}-${new Date().toLocaleDateString('en-CA')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderCards(results) {
  const wrap = document.getElementById('cards-wrap');
  if (!wrap) return;
  const filtered = getFilteredResults();
  if (!filtered.length) {
    wrap.innerHTML = `<div style="text-align:center;padding:32px;color:var(--sub);font-size:14px">Tidak ada resi di kategori ini.</div>`;
    return;
  }
  let html = '';
  // Pakai index dari lastResults biar toggleDetail tetap benar
  filtered.forEach((r) => {
    const idx        = lastResults.indexOf(r);
    const meta       = r.ok && r.stage ? STAGE_META[r.stage] : null;
    const dotColor   = r.needCourier ? '#fcd34d' : (meta ? meta.dot : '#94a3b8');
    const badgeLabel = r.needCourier ? 'Pilih Kurir' : (meta ? meta.label : (r.ok ? 'Dikirim' : 'Tidak Ditemukan'));
    const badgeBg    = r.needCourier ? '#fffbeb' : (meta ? meta.bg : '#f8fafc');
    const badgeColor = r.needCourier ? '#d97706' : (meta ? meta.color : '#64748b');
    const latestDesc = r.ok && r.history?.length ? (r.history[r.history.length - 1].desc || '') : '';
    const courierTxt = r.courierLabel ? r.courierLabel + (latestDesc ? ' · ' : '') : '';
    const subText    = r.ok ? courierTxt + latestDesc.slice(0, 60) + (latestDesc.length > 60 ? '…' : '') : (r.error || '');

    html += `
    <div class="resi-card" id="card-${idx}">
      <div class="resi-head" onclick="toggleDetail(${idx})">
        <div class="resi-left">
          <div class="stage-dot" style="background:${dotColor}"></div>
          <div style="min-width:0">
            <div class="resi-num">${r.resi}<button class="copy-btn" onclick="copyResi(event,'${r.resi}')">copy</button></div>
            <div class="resi-sub">${subText}</div>
          </div>
        </div>
        <div class="resi-right">
          <span class="stage-badge" style="background:${badgeBg};color:${badgeColor};border:1px solid ${badgeColor}22">${badgeLabel}</span>
          <span class="chevron" id="chev-${idx}">▶</span>
        </div>
      </div>
      <div class="resi-detail" id="detail-${idx}">
        ${renderDetail(r)}
      </div>
    </div>`;
  });

  wrap.innerHTML = html;
}

// ── Render detail ─────────────────────────────────────────────────────────────
function renderDetail(r) {
  if (r.needCourier) {
    return `<div class="need-courier-box">
      ⚠ Kurir tidak terdeteksi. Pilih manual:
      <select>${COURIER_OPTIONS}</select>
      <button onclick="retryWithCourier('${r.resi}', this.previousElementSibling)">Cek →</button>
    </div>`;
  }
  if (!r.ok) return `<div class="err-box">⚠ ${r.error}</div>`;

  const meta    = STAGE_META[r.stage] || STAGE_META['DIKIRIM'];
  const allDone = r.stage === 'SAMPAI';
  let html = '';

  // Meta info
  const metas = [];
  if (r.courierLabel) metas.push({ label:'Kurir',    val: r.courierLabel });
  if (r.receiver)     metas.push({ label:'Diterima', val: r.receiver });
  if (r.city)         metas.push({ label:'Kota',     val: r.city });
  if (metas.length) {
    html += `<div class="meta-row">${metas.map(m =>
      `<div class="meta-item">${m.label}<strong>${m.val}</strong></div>`
    ).join('')}</div>`;
  }

  // Stepper
  html += `<div class="tr-stepper">${STEP_LABELS.map((label, i) => {
    const idx = i + 1;
    let cls = 'tr-step';
    if (allDone || idx < meta.step)     cls += ' tr-step-done';
    else if (idx === meta.step) {
      if (meta.problem) cls += ' tr-step-problem';
      else if (meta.retur) cls += ' tr-step-retur';
      else cls += ' tr-step-active';
    }
    const icon = (allDone || idx < meta.step) ? '✓' : idx;
    return `<div class="${cls}"><div class="tr-step-line"></div><div class="tr-step-circle">${icon}</div><div class="tr-step-label">${label}</div></div>`;
  }).join('')}</div>`;

  // History — reverse agar terbaru di atas (sama dengan CS Input)
  if (!r.history?.length) {
    html += `<div style="font-size:13px;color:var(--sub)">Tidak ada riwayat tersedia.</div>`;
    return html;
  }

  const historyReversed = [...r.history].reverse();
  html += `<div class="history-title">Riwayat Pengiriman</div>
  <div class="history-list">`;

  historyReversed.forEach((h, i) => {
    const isLatest  = i === 0;
    const dotColor  = isLatest ? meta.color : '#cbd5e1';
    const desc      = h.desc || h.content || h.content2 || '—';
    const locPart   = h.location_name ? ` · ${h.location_name}` : (h.counter_name ? ` · ${h.counter_name}` : (h.city_name ? ` · ${h.city_name}` : ''));
    const datePart  = h.date || '';

    html += `
    <div class="history-item">
      <div class="history-dot-wrap">
        <div class="history-dot" style="background:${dotColor}"></div>
        <div class="history-line"></div>
      </div>
      <div class="history-body">
        <div class="history-desc${isLatest ? ' latest' : ''}">${desc}</div>
        <div class="history-meta">${datePart}${locPart}</div>
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function toggleDetail(idx, forceOpen = false) {
  const detail = document.getElementById(`detail-${idx}`);
  const chev   = document.getElementById(`chev-${idx}`);
  const head   = detail.previousElementSibling;
  if (forceOpen) detail.classList.add('open');
  else           detail.classList.toggle('open');
  const isOpen = detail.classList.contains('open');
  chev.classList.toggle('open', isOpen);
  head.classList.toggle('open', isOpen);
}

function copyResi(e, resi) {
  e.stopPropagation();
  navigator.clipboard.writeText(resi).then(() => {
    const btn = e.target;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = 'copy', 1200);
  });
}
</script>
